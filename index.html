<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>쉘위고 트립 | 국내여행·숙소추천</title>
<meta name="description" content="집이 제일 좋은 사람도 떠나고 싶게. 국내여행과 숙소를 1분 영상으로 소개하는 쉘위고 트립의 링크 모음이에요.">
<meta name="theme-color" content="#2b86c5">
<meta property="og:type" content="website">
<meta property="og:title" content="쉘위고 트립">
<meta property="og:description" content="집이 제일 좋은 사람도 떠나고 싶게. 국내여행·숙소추천 1분 영상">
<meta property="og:image" content="https://goldyjstudio.github.io/img/og.jpg">
<meta property="og:url" content="https://goldyjstudio.github.io/">
<link rel="icon" href="img/profile.jpg">
<link rel="apple-touch-icon" href="img/profile.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #2b86c5;
    --sky-deep: #155d93;
    --sea: #0c3f66;
    --ice: #d6ebfb;
    --cloud: #f8fcff;
    --sand: #f0d6a2;
    --ink: #10314d;
    --muted: #5a7891;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink);
    background: var(--sea);
  }

  /* 사진 배경: 위는 하늘, 아래로 갈수록 바다색으로 */
  .scene {
    position: relative;
    min-height: 100vh;
    padding: 0 16px 40px;
    background:
      linear-gradient(180deg, rgba(43,134,197,0) 0%, rgba(43,134,197,0) 34%, rgba(21,93,147,.55) 52%, var(--sea) 72%),
      url("img/beach.jpg") 42% 0 / auto 760px no-repeat,
      var(--sky);
  }
  @media (min-width: 700px) {
    .scene { background-size: auto, 1600px auto, auto; background-position: 0 0, 50% -60px, 0 0; }
  }

  .wrap { max-width: 440px; margin: 0 auto; }

  header {
    padding: 64px 0 28px;
    text-align: center;
  }

  /* 배너와 같은 입체 글씨 */
  .wordmark {
    margin: 0;
    font-family: "Bagel Fat One", sans-serif;
    font-weight: 400;
    font-size: clamp(56px, 18vw, 84px);
    line-height: 1.02;
    letter-spacing: .01em;
    color: #ffffff;
    background: linear-gradient(180deg, #ffffff 35%, #c7e2fa 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter:
      drop-shadow(0 2px 0 #9cc8ee)
      drop-shadow(0 2px 0 #7fb4e6)
      drop-shadow(0 2px 0 #5d9ad8)
      drop-shadow(0 8px 14px rgba(12,63,102,.35));
  }
  .wordmark span { display: block; }

  .pill {
    display: inline-block;
    margin: 0 0 18px;
    padding: 7px 16px;
    border-radius: 999px;
    background: rgba(255,255,255,.92);
    color: var(--sky-deep);
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 4px 0 rgba(93,154,216,.5);
  }

  .tagline {
    margin: 22px 0 0;
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    text-shadow: 0 1px 2px rgba(12,63,102,.6), 0 0 12px rgba(12,63,102,.35);
  }

  /* 링크 묶음 */
  .group { margin-top: 26px; }
  .group h2 {
    margin: 0 4px 10px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(12,63,102,.8);
  }

  .links { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }

  .link {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 64px;
    padding: 10px 18px 10px 10px;
    border-radius: 20px;
    background: var(--cloud);
    color: var(--ink);
    text-decoration: none;
    box-shadow: 0 4px 0 #9cc8ee;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .link:active { transform: translateY(3px); box-shadow: 0 1px 0 #9cc8ee; }
  .link:focus-visible { outline: 3px solid var(--sand); outline-offset: 3px; }

  .icon {
    flex: none;
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border-radius: 13px;
    color: #fff;
  }
  .icon svg { width: 24px; height: 24px; }
  .yt { background: #ff0033; }
  .tt { background: #000; }
  .ig { background: radial-gradient(circle at 30% 110%, #ffd776 0%, #f7613e 35%, #d6249f 60%, #6f3bd6 100%); }
  .clip { background: #03c75a; }
  .cp { background: #fff; box-shadow: inset 0 0 0 1.5px #e4ecf3; }
  .shop { background: #03c75a; }

  .text { display: grid; gap: 2px; min-width: 0; }
  .name { font-size: 17px; font-weight: 600; }
  .sub { font-size: 13px; color: var(--muted); }

  .link[aria-disabled="true"] { opacity: .62; pointer-events: none; box-shadow: none; }
  .soon {
    margin-left: auto;
    flex: none;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--ice);
    color: var(--sky-deep);
    font-size: 12px;
    font-weight: 600;
  }

  /* 추천템 묶음은 모래색으로 구분 */
  .shopping .link { background: #fffaf0; box-shadow: 0 4px 0 #e2c48a; }
  .shopping .link:active { box-shadow: 0 1px 0 #e2c48a; }

  .notice {
    margin: 12px 4px 0;
    padding: 12px 14px;
    border-radius: 14px;
    background: rgba(255,255,255,.1);
    color: var(--ice);
    font-size: 13px;
    line-height: 1.6;
  }

  footer {
    margin-top: 34px;
    text-align: center;
    color: rgba(214,235,251,.75);
    font-size: 13px;
  }
  .small-links { display: flex; justify-content: center; gap: 12px; margin-bottom: 14px; }
  .small-links a {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,.14);
    color: #fff;
  }
  .small-links a:focus-visible { outline: 3px solid var(--sand); outline-offset: 3px; }
  .small-links svg { width: 22px; height: 22px; }
  footer p { margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    .link { transition: none; }
  }
</style>
</head>
<body>
<div class="scene">
  <div class="wrap">

    <header>

      <h1 class="wordmark"><span>쉘위고</span><span>트립</span></h1>
      <p class="tagline">집이 제일 좋은 사람도 떠나고 싶게</p>

    <main>

          <li>
            <a class="link" href="https://clip.naver.com/@shallwego_trip" target="_blank" rel="noopener">

              <span class="text"><span class="name">네이버 클립</span><span class="sub">@shallwego_trip</span></span>
            </a>
          </li>
        </ul>
      </section>

      <section class="group shopping" aria-labelledby="g-shop">
        <h2 id="g-shop">영상 속 추천템</h2>
        <ul class="links">
          <li>
            <a class="link" href="https://influencers.coupang.com/s/goldyjin" target="_blank" rel="noopener">
              <span class="icon cp" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#e5352b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8L5 8z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></svg></span>
              <span class="text"><span class="name">쿠팡 추천템 모음</span><span class="sub">영상에 나온 여행템</span></span>
            </a>
          </li>
          <li>
            <!-- 네이버 클립 크리에이터 샵 주소 자리 -->
            <a class="link" href="#" aria-disabled="true">
              <span class="icon shop" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9.5 5.5 5h13L20 9.5M4 9.5h16M4 9.5c0 1.4 1.1 2.5 2.7 2.5S9.3 10.9 9.3 9.5c0 1.4 1.2 2.5 2.7 2.5s2.7-1.1 2.7-2.5c0 1.4 1.1 2.5 2.6 2.5S20 10.9 20 9.5M5.5 12v7h13v-7"/></svg></span>
              <span class="text"><span class="name">네이버 클립 샵</span><span class="sub">네이버에서 바로 구매</span></span>

        </ul>
        <p class="notice">이 페이지에는 쿠팡 파트너스 활동으로 일정액의 수수료를 받을 수 있는 링크가 포함되어 있습니다.</p>
      </section>
    </main>

    <footer>
      <div class="small-links">
        <a href="https://www.facebook.com/shallwego.trip" target="_blank" rel="noopener" aria-label="페이스북">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-7.4H16l.4-3h-2.9V8.8c0-.9.3-1.5 1.5-1.5h1.5V4.6c-.3 0-1.2-.1-2.2-.1-2.2 0-3.7 1.3-3.7 3.8v2.3H8.1v3h2.5V21h2.9z"/></svg>
        </a>
      </div>
      <p>© 쉘위고 트립</p>
    </footer>

  </div>
</div>
</body>
</html>
